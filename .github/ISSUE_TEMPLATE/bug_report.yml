name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for someone else
        to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / design system
        - Authentication / RBAC
        - Provider review
        - Blockchain / Soroban
        - API integration
        - Build / CI / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, and whether this is local, preview, or production.
      placeholder: Chrome 131 on macOS 15, Node 20, local dev

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant console/server logs or drag in screenshots. Remove tokens and PII.
      render: shell

name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Explain the problem first so we can evaluate the right solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What admin workflow is difficult or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or UI you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / design system
        - Authentication / RBAC
        - Provider review
        - Blockchain / Soroban
        - API integration
        - Build / CI / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would need to be true for this to be considered done?
      placeholder: |
        - [ ] ...
        - [ ] ...
